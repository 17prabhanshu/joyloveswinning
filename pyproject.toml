[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps3-firmware-agent"
version = "0.1.0"
description = "AI Agent for Autonomous Embedded Firmware Testing (Black Box Hackathon PS3)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[project.optional-dependencies]
ai = ["openai>=1.0", "google-generativeai>=0.8.0", "anthropic>=0.30.0"]
z3 = ["z3-solver>=4.12"]
all = ["ps3-firmware-agent[ai,z3]"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
firmware-agent = "firmware_agent.cli:main"
labwired-agent = "firmware_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["firmware_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

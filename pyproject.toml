[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps3-firmware-agent"
version = "1.0.0"
description = "Autonomous Firmware Red-Team Agent for embedded firmware testing"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "diskcache>=5.6.3",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "google-generativeai>=0.3"]
dev = ["pytest>=7.0", "httpx>=0.24"]
ast = ["tree-sitter>=0.20", "tree-sitter-c>=0.20"]

[project.scripts]
ps3-agent = "ps3_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ps3_agent*"]

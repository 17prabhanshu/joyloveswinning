<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DARKINT :: RIG-VIEW — Embedded Trace Instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --pcb-black: #0b0f0d;
    --pcb-panel: #10201a;
    --pcb-panel-2: #142620;
    --copper: #b8733b;
    --copper-dim: #6f4728;
    --phosphor: #ffb000;
    --phosphor-dim: #6b4b0a;
    --silk: #e9ede7;
    --silk-dim: #6f7a73;
    --sig-red: #ff4f3e;
    --sig-green: #4ade80;
    --hair: rgba(233,237,231,0.14);
    --radius: 3px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--pcb-black);
    color: var(--silk);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .display {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  /* ---------- App shell ---------- */
  #app {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background:
      radial-gradient(1200px 700px at 70% 15%, rgba(184,115,59,0.08), transparent 60%),
      radial-gradient(900px 600px at 15% 85%, rgba(255,176,0,0.05), transparent 55%),
      var(--pcb-black);
  }

  /* ---------- Header ---------- */
  #header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hair);
    background: linear-gradient(180deg, rgba(20,38,32,0.55), transparent);
    z-index: 30;
    flex-wrap: wrap;
    row-gap: 8px;
  }
  #brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-right: 16px;
    border-right: 1px solid var(--hair);
    margin-right: 4px;
  }
  #brand .mark {
    font-size: 22px;
    line-height: 1;
    color: var(--copper);
  }
  #brand .name {
    font-size: 20px;
    letter-spacing: 0.02em;
  }
  #brand .sub {
    font-size: 10px;
    color: var(--silk-dim);
    letter-spacing: 0.14em;
  }
  .manifest {
    display: flex;
    gap: 18px;
    font-size: 11px;
    color: var(--silk-dim);
    flex-wrap: wrap;
  }
  .manifest b {
    color: var(--silk);
    font-weight: 500;
  }
  .manifest .k { color: var(--silk-dim); }
  .verdict-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    font-size: 12px;
    background: rgba(0,0,0,0.25);
  }
  .verdict-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sig-green);
    box-shadow: 0 0 8px var(--sig-green);
  }
  .verdict-dot.fail { background: var(--sig-red); box-shadow: 0 0 8px var(--sig-red); }
  .verdict-dot.empty { background: var(--silk-dim); box-shadow: none; }

  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--silk);
    background: rgba(233,237,231,0.04);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    padding: 7px 11px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--copper); background: rgba(184,115,59,0.10); }
  .btn.accent { border-color: var(--copper); color: var(--phosphor); }
  .btn:active { transform: translateY(1px); }
  #fileInput { display: none; }

  /* ---------- Stage ---------- */
  #stage-wrap {
    position: relative;
    overflow: hidden;
    cursor: crosshair;
  }
  #canvas-host { position: absolute; inset: 0; }
  #canvas-host canvas { display: block; width: 100%; height: 100%; }

  .corner {
    position: absolute;
    width: 22px; height: 22px;
    border: 1px solid var(--copper-dim);
    opacity: 0.55;
    pointer-events: none;
  }
  .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
  .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
  .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

  #empty-msg {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    text-align: center;
    pointer-events: none;
  }
  #empty-msg.show { display: flex; }
  #empty-msg .glyph { font-size: 30px; color: var(--silk-dim); opacity: 0.5; }
  #empty-msg .t1 { font-family: 'Big Shoulders Display', sans-serif; font-size: 22px; color: var(--silk-dim); }
  #empty-msg .t2 { font-size: 11px; color: var(--silk-dim); max-width: 320px; line-height: 1.6; }

  .demo-flag {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--phosphor);
    background: rgba(11,15,13,0.7);
    border: 1px solid var(--phosphor-dim);
    border-radius: var(--radius);
    padding: 4px 10px;
    z-index: 5;
  }

  /* floating right telemetry rail */
  #rail {
    position: absolute;
    top: 14px; right: 14px; bottom: 14px;
    width: 264px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 6;
    transition: transform .25s ease, opacity .25s ease;
  }
  #rail.collapsed { transform: translateX(280px); opacity: 0; pointer-events: none; }
  .panel {
    background: rgba(16,32,26,0.72);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    backdrop-filter: blur(6px);
    padding: 10px 12px;
  }
  .panel-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--copper);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  #uart-log {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.7;
    color: var(--sig-green);
    min-height: 90px;
  }
  #uart-log .row { opacity: 0; animation: rise .18s ease forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px);} to { opacity:1; transform:none; } }
  #uart-log .t { color: var(--silk-dim); margin-right: 8px; }
  .kv { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px dashed var(--hair); }
  .kv:last-child { border-bottom: none; }
  .kv .v { color: var(--silk); }
  .kv .v.fault { color: var(--sig-red); }
  .kv .v.ok { color: var(--sig-green); }

  #toggle-rail {
    position: absolute;
    top: 14px; right: 14px;
    z-index: 7;
  }
  #rail.collapsed ~ #toggle-rail { right: 14px; }

  /* explode + view controls, bottom-left of stage */
  #stage-controls {
    position: absolute;
    left: 14px; bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 6;
    background: rgba(16,32,26,0.72);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    padding: 8px 12px;
    backdrop-filter: blur(6px);
  }
  #stage-controls label {
    font-size: 10px;
    color: var(--silk-dim);
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 110px;
    height: 3px;
    background: var(--hair);
    border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--phosphor);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,176,0,0.6);
  }

  /* ---------- Transport / timeline ---------- */
  #transport {
    border-top: 1px solid var(--hair);
    background: linear-gradient(0deg, rgba(20,38,32,0.55), transparent);
    padding: 10px 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 30;
  }
  #transport-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tbtn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(233,237,231,0.04);
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    color: var(--silk);
    cursor: pointer;
    font-size: 12px;
    flex-shrink: 0;
  }
  .tbtn:hover { border-color: var(--copper); }
  .tbtn.play { border-color: var(--copper); color: var(--phosphor); }
  #speed-select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: rgba(233,237,231,0.04);
    border: 1px solid var(--hair);
    color: var(--silk);
    border-radius: var(--radius);
    padding: 6px 8px;
  }
  #time-readout {
    font-size: 11px;
    color: var(--silk-dim);
    min-width: 148px;
    text-align: right;
  }
  #time-readout b { color: var(--phosphor); font-weight: 500; }

  #scrub-wrap {
    position: relative;
    height: 34px;
    border: 1px solid var(--hair);
    border-radius: var(--radius);
    background: rgba(0,0,0,0.25);
    cursor: pointer;
  }
  #scrub-track {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(184,115,59,0.35), rgba(255,176,0,0.15));
    width: 0%;
  }
  #scrub-ticks { position: absolute; inset: 0; }
  .tick {
    position: absolute;
    top: 4px; bottom: 4px;
    width: 2px;
    border-radius: 1px;
    background: var(--sig-green);
    cursor: pointer;
  }
  .tick.fail { background: var(--sig-red); }
  .playhead {
    position: absolute;
    top: -2px; bottom: -2px;
    width: 2px;
    background: var(--phosphor);
    box-shadow: 0 0 6px var(--phosphor);
    pointer-events: none;
  }

  #evidence {
    position: absolute;
    left: 20px; bottom: 92px;
    width: 320px;
    z-index: 8;
    transform: translateY(12px);
    opacity: 0;
    pointer-events: none;
    transition: all .18s ease;
  }
  #evidence.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #evidence .panel-title { color: var(--sig-red); }
  #evidence.pass .panel-title { color: var(--sig-green); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--copper-dim); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 760px) {
    #rail { display: none; }
    .manifest { font-size: 10px; gap: 10px; }
    #time-readout { min-width: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div id="app">

  <header id="header">
    <div id="brand">
      <span class="mark">◉</span>
      <div>
        <div class="name display">RIG&#8209;VIEW</div>
        <div class="sub">trace.v1 instrument</div>
      </div>
    </div>
    <div class="manifest">
      <span><span class="k">CHIP</span> <b id="m-chip">—</b></span>
      <span><span class="k">TEST</span> <b id="m-test">—</b></span>
      <span><span class="k">RUN</span> <b id="m-run">—</b></span>
      <span><span class="k">SEED</span> <b id="m-seed">—</b></span>
    </div>
    <div class="verdict-badge">
      <span class="verdict-dot empty" id="verdict-dot"></span>
      <span id="verdict-text">NO DATA</span>
    </div>
    <button class="btn" id="load-btn">LOAD TRACE.V1.JSON</button>
    <input type="file" id="fileInput" accept="application/json" />
    <button class="btn accent" id="demo-btn">DEMO DATA</button>
    <button class="btn" id="clear-btn">CLEAR STAGE</button>
  </header>

  <div id="stage-wrap">
    <div id="canvas-host"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="demo-flag" id="demo-flag" style="display:none;">DEMO DATA — NOT A LIVE RUN</div>

    <div id="empty-msg">
      <div class="glyph">▢</div>
      <div class="t1 display">NO RUN DATA</div>
      <div class="t2">No trace.v1 artifact is loaded. Load a trace file from an executed run, or load the demo trace to preview the instrument.</div>
    </div>

    <div id="stage-controls">
      <label>EXPLODE <input type="range" id="explode" min="0" max="100" value="0"></label>
      <label>ROTATE <input type="checkbox" id="autorotate" checked style="accent-color: var(--copper);"></label>
      <span class="tbtn" id="reset-view" title="Reset view">⟲</span>
    </div>

    <div id="evidence"></div>

    <div id="rail">
      <div class="panel" style="flex: 0 0 auto;">
        <div class="panel-title">SENSOR / STATE</div>
        <div id="state-kv"></div>
      </div>
      <div class="panel" style="flex: 1; display:flex; flex-direction:column; min-height:0;">
        <div class="panel-title">UART0 <span id="uart-dir">—</span></div>
        <div id="uart-log"></div>
      </div>
      <div class="panel" style="flex: 0 0 auto;">
        <div class="panel-title">EXECUTING</div>
        <div id="exec-fn" style="font-size:12px; color: var(--phosphor);">—</div>
        <div id="exec-src" style="font-size:10px; color: var(--silk-dim); margin-top:3px;">—</div>
      </div>
    </div>
    <div class="tbtn" id="toggle-rail" title="Toggle telemetry">☰</div>
  </div>

  <div id="transport">
    <div id="scrub-wrap">
      <div id="scrub-track"></div>
      <div id="scrub-ticks"></div>
      <div class="playhead" id="playhead" style="left:0%;"></div>
    </div>
    <div id="transport-controls">
      <span class="tbtn" id="step-back" title="Step back">◀|</span>
      <span class="tbtn play" id="play-pause" title="Play/Pause">▶</span>
      <span class="tbtn" id="step-fwd" title="Step forward">|▶</span>
      <select id="speed-select">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
      <span id="time-readout"><b id="t-now">0.00</b> ms / <span id="t-total">0.00</span> ms</span>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     TRACE.V1 STATE
     ============================================================ */
  let trace = null;
  let isDemo = false;
  let sampleIndex = {}; // channel -> sorted array of t_ns
  let playhead_ns = 0;
  let playing = false;
  let speed = 1;
  let lastFrameTime = null;

  const $ = (id) => document.getElementById(id);

  function buildIndex(tr) {
    sampleIndex = {};
    if (!tr) return;
    const ch = tr.channels || {};
    for (const key of Object.keys(ch)) {
      sampleIndex[key] = (ch[key] || []).slice().sort((a,b)=>a.t_ns-b.t_ns);
    }
  }

  // binary search: most recent sample at or before t
  function latestAt(arr, t) {
    if (!arr || arr.length === 0) return null;
    let lo = 0, hi = arr.length - 1, ans = null;
    while (lo <= hi) {
      const mid = (lo+hi) >> 1;
      if (arr[mid].t_ns <= t) { ans = arr[mid]; lo = mid+1; }
      else hi = mid-1;
    }
    return ans;
  }

  function allAt(arr, t, key) {
    // latest value per distinct key (e.g. per pin) at time t
    if (!arr) return {};
    const out = {};
    for (const s of arr) {
      if (s.t_ns > t) break;
      out[s[key]] = s;
    }
    return out;
  }

  /* ============================================================
     DEMO DATA — clearly synthetic, schema-valid trace.v1
     ============================================================ */
  function makeDemoTrace() {
    const ns = (ms) => Math.round(ms*1e6);
    const gpio = [];
    const uart = [];
    const sensors = [];
    const faults = [];
    const execution = [];
    const assertions = [];

    let t = 0;
    const pushUart = (ms, line) => uart.push({t_ns: ns(ms), direction:"tx", bytes: btoa(line)});
    const temps = [22,24,27,29,31,33,36,40,44,48,50,50,50,49,47,44,40,35,30,26,23];
    let tm = 0;
    for (let i=0;i<temps.length;i++){
      tm = i*140;
      sensors.push({t_ns: ns(tm), id:"TEMP0", value: temps[i], unit:"C", fault: i===11 ? "stuck" : "none"});
      pushUart(tm+4, "TEMP=" + temps[i] + "C\n");
      const fanHigh = temps[i] >= 45;
      const fanLow  = temps[i] >= 30 && temps[i] < 45;
      gpio.push({t_ns: ns(tm+6), pin:"FAN_HIGH", value: fanHigh?1:0});
      gpio.push({t_ns: ns(tm+6), pin:"FAN_LOW",  value: fanLow?1:0});
      gpio.push({t_ns: ns(tm+6), pin:"LED_STATUS", value: (i%2===0)?1:0});
      execution.push({t_ns: ns(tm+2), pc:"0x08000"+(120+i), function:"update_fan", source:{file:"fan_controller.c", line: 74+ (i%4)}});
    }
    faults.push({t_ns: ns(11*140), kind:"sensor_stuck", detail:"TEMP0 held last value across 2 samples"});
    assertions.push({t_ns: ns(2*140), type:"gpio_equals", verdict:"pass", expected:{pin:"FAN_HIGH",value:0}, observed:{pin:"FAN_HIGH",value:0}, evidence_path:"artifacts/evidence/demo_low.json"});
    assertions.push({t_ns: ns(9*140), type:"gpio_equals", verdict:"pass", expected:{pin:"FAN_HIGH",value:1}, observed:{pin:"FAN_HIGH",value:1}, evidence_path:"artifacts/evidence/demo_high.json"});
    assertions.push({t_ns: ns(11*140), type:"uart_not_contains", verdict:"fail", expected:"no repeated TEMP after fault", observed:"TEMP=50C repeated, sensor stuck undetected", evidence_path:"artifacts/evidence/demo_fault.json"});
    assertions.push({t_ns: ns(16*140), type:"gpio_sequence", verdict:"pass", expected:"FAN_HIGH->FAN_LOW on recovery", observed:"matched", evidence_path:"artifacts/evidence/demo_recover.json"});

    return {
      schema: "trace.v1",
      run_id: "demo_9f31ac2",
      test_id: "temp_boundary_sweep",
      firmware_hash: "sha256:2f1a9c8e0b",
      verdict: "FAIL",
      duration_ns: ns((temps.length-1)*140 + 20),
      board: {
        chip: "ATSAMD21G18A",
        package: "TQFP-48",
        pin_count: 48,
        peripherals: [
          {id:"LED_STATUS", kind:"led", label:"STATUS LED", position:[1.6,0.15,-1.1], pins:["LED_STATUS"]},
          {id:"FAN0", kind:"motor", label:"COOLING FAN", position:[-2.0,0.05,0.4], pins:["FAN_HIGH","FAN_LOW"]},
          {id:"TEMP0", kind:"sensor", label:"TEMP SENSOR", position:[1.7,0.1,1.3], pins:["TEMP0"]},
          {id:"UART0", kind:"uart", label:"UART0", position:[-1.7,0.05,-1.3], pins:["TX","RX"]}
        ]
      },
      channels: { gpio, uart, registers: [], sensors, faults, execution },
      assertions
    };
  }

  /* ============================================================
     THREE.JS SCENE
     ============================================================ */
  let scene, camera, renderer, host;
  let rig, boardGroup, mcuGroup, pinsGroup;
  const peripheralNodes = {}; // id -> {group, kind, emissive mats, ...}
  const traceTubesById = {};
  let W=1,H=1;
  let camYaw = 0.5, camPitch = 0.55, camDist = 9.2;
  let dragging = false, lastX=0, lastY=0;
  let explodeAmt = 0;
  let idleTimer = null;

  function canvasTexture(draw, w=512, h=256) {
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const ctx = c.getContext('2d');
    draw(ctx, w, h);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    return tex;
  }

  function boardTexture() {
    return canvasTexture((ctx,w,h)=>{
      ctx.fillStyle = '#0d231b'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = 'rgba(184,115,59,0.22)'; ctx.lineWidth = 1;
      for(let x=0;x<w;x+=22){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
      for(let y=0;y<h;y+=22){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(233,237,231,0.35)'; ctx.lineWidth=1.4;
      ctx.strokeRect(30,30,w-60,h-60);
      ctx.font = '600 15px monospace'; ctx.fillStyle='rgba(233,237,231,0.5)';
      ctx.fillText('QUANTELLA · PS3-AGENT', 40, 54);
    }, 1024, 512);
  }

  function labelTexture(text, color) {
    return canvasTexture((ctx,w,h)=>{
      ctx.clearRect(0,0,w,h);
      ctx.font = '600 42px "IBM Plex Mono", monospace';
      ctx.fillStyle = color || '#e9ede7';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 8, h/2);
    }, 320, 80);
  }

  function makeSprite(text, color, scale) {
    const tex = labelTexture(text, color);
    const mat = new THREE.SpriteMaterial({map: tex, transparent:true, depthTest:false});
    const spr = new THREE.Sprite(mat);
    spr.scale.set(scale||1.4, (scale||1.4)*0.25, 1);
    return spr;
  }

  function initScene() {
    host = $('canvas-host');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0f0d, 0.045);

    camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    updateCamera();

    renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    renderer.setClearColor(0x0b0f0d, 1);
    host.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x556b60, 0.55));
    const key = new THREE.DirectionalLight(0xfff2df, 1.05);
    key.position.set(4,7,4);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xb8733b, 0.5);
    rim.position.set(-5,3,-4);
    scene.add(rim);
    const fill = new THREE.PointLight(0xffb000, 0.35, 20);
    fill.position.set(0,3,4);
    scene.add(fill);

    // ground contact shadow (fake, radial gradient plane)
    const shadowTex = canvasTexture((ctx,w,h)=>{
      const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
      g.addColorStop(0,'rgba(0,0,0,0.55)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }, 512,512);
    const shadowMat = new THREE.MeshBasicMaterial({map: shadowTex, transparent:true, depthWrite:false});
    const shadowMesh = new THREE.Mesh(new THREE.PlaneGeometry(9,9), shadowMat);
    shadowMesh.rotation.x = -Math.PI/2;
    shadowMesh.position.y = -1.05;
    scene.add(shadowMesh);

    rig = new THREE.Group();
    scene.add(rig);

    buildAssembly();

    host.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    host.addEventListener('wheel', onWheel, {passive:false});
    window.addEventListener('resize', onResize);
    onResize();

    requestAnimationFrame(tick);
  }

  function buildAssembly() {
    boardGroup = new THREE.Group();
    rig.add(boardGroup);

    // substrate
    const boardGeo = new THREE.BoxGeometry(6.2, 0.16, 4.2);
    const boardMat = new THREE.MeshStandardMaterial({
      map: boardTexture(), roughness:0.7, metalness:0.15, color: 0xffffff
    });
    const boardMesh = new THREE.Mesh(boardGeo, boardMat);
    boardMesh.position.y = -1;
    boardGroup.add(boardMesh);

    // edge copper rim
    const rimGeo = new THREE.BoxGeometry(6.28, 0.03, 4.28);
    const rimMat = new THREE.MeshStandardMaterial({color:0xb8733b, roughness:0.35, metalness:0.6});
    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
    rimMesh.position.y = -0.92;
    boardGroup.add(rimMesh);

    // MCU
    mcuGroup = new THREE.Group();
    mcuGroup.position.set(0, -0.62, 0);
    boardGroup.add(mcuGroup);
    const mcuBody = new THREE.Mesh(
      new THREE.BoxGeometry(1.5,0.28,1.5),
      new THREE.MeshStandardMaterial({color:0x14100c, roughness:0.5, metalness:0.4})
    );
    mcuGroup.add(mcuBody);
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.06,16),
      new THREE.MeshBasicMaterial({color:0xe9ede7}));
    dot.rotation.x = -Math.PI/2;
    dot.position.set(-0.62,0.141,-0.62);
    mcuGroup.add(dot);
    const chipLabel = makeSprite('ATSAMD21', '#e9ede7', 1.5);
    chipLabel.position.set(0, 0.35, 0);
    mcuGroup.add(chipLabel);

    // instanced pins around MCU
    const pinsPerSide = 12;
    const pinGeo = new THREE.BoxGeometry(0.05,0.06,0.14);
    const pinMat = new THREE.MeshStandardMaterial({color:0xc9a06a, roughness:0.4, metalness:0.7});
    pinsGroup = new THREE.InstancedMesh(pinGeo, pinMat, pinsPerSide*4);
    const dummy = new THREE.Object3D();
    let idx=0;
    const half = 0.75, step = 1.5/(pinsPerSide-1);
    for (let i=0;i<pinsPerSide;i++){
      const off = -0.75 + i*step;
      dummy.position.set(off, 0.15, -half-0.08); dummy.rotation.y=0; dummy.updateMatrix(); pinsGroup.setMatrixAt(idx++, dummy.matrix);
      dummy.position.set(off, 0.15,  half+0.08); dummy.rotation.y=0; dummy.updateMatrix(); pinsGroup.setMatrixAt(idx++, dummy.matrix);
      dummy.position.set(-half-0.08, 0.15, off); dummy.rotation.y=Math.PI/2; dummy.updateMatrix(); pinsGroup.setMatrixAt(idx++, dummy.matrix);
      dummy.position.set( half+0.08, 0.15, off); dummy.rotation.y=Math.PI/2; dummy.updateMatrix(); pinsGroup.setMatrixAt(idx++, dummy.matrix);
    }
    mcuGroup.add(pinsGroup);

    // header pin block (generic connector rail along back edge)
    for (let i=0;i<10;i++){
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.22,6),
        new THREE.MeshStandardMaterial({color:0xd9b98a, metalness:0.8, roughness:0.3}));
      p.position.set(-2.6 + i*0.16, -0.85, -1.85);
      boardGroup.add(p);
    }
  }

  function clearPeripherals() {
    for (const id in peripheralNodes) {
      boardGroup.remove(peripheralNodes[id].group);
    }
    for (const id in traceTubesById) {
      boardGroup.remove(traceTubesById[id]);
    }
    Object.keys(peripheralNodes).forEach(k=>delete peripheralNodes[k]);
    Object.keys(traceTubesById).forEach(k=>delete traceTubesById[k]);
  }

  function buildPeripheralsFromBoard(board) {
    clearPeripherals();
    if (!board || !board.peripherals) return;

    // update chip label
    const mcuLabelIdx = mcuGroup.children.findIndex(c=>c.isSprite);
    if (mcuLabelIdx>=0) mcuGroup.remove(mcuGroup.children[mcuLabelIdx]);
    const lbl = makeSprite(board.chip || 'MCU', '#e9ede7', 1.7);
    lbl.position.set(0,0.35,0);
    mcuGroup.add(lbl);

    board.peripherals.forEach(p=>{
      const g = new THREE.Group();
      const pos = p.position || [0,0,0];
      g.position.set(pos[0], pos[1]-0.7, pos[2]);
      let node = {group:g, kind:p.kind, id:p.id};

      if (p.kind === 'led') {
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.2,10),
          new THREE.MeshStandardMaterial({color:0x222222, emissive:0x000000, roughness:0.4}));
        g.add(body);
        node.mat = body.material;
      } else if (p.kind === 'motor') {
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.22,16),
          new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.6, metalness:0.3}));
        g.add(base);
        const blades = new THREE.Group();
        for (let i=0;i<3;i++){
          const bl = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.09),
            new THREE.MeshStandardMaterial({color:0xe9ede7, roughness:0.5}));
          bl.position.x = 0.25;
          bl.rotation.y = i*(Math.PI*2/3);
          const pivot = new THREE.Group(); pivot.rotation.y = i*(Math.PI*2/3);
          bl.position.set(0.25,0,0);
          pivot.add(bl);
          blades.add(pivot);
        }
        blades.position.y = 0.14;
        g.add(blades);
        node.blades = blades;
        node.speedRef = {v:0};
      } else if (p.kind === 'sensor') {
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.28,10),
          new THREE.MeshStandardMaterial({color:0x2b2f2c, roughness:0.5, metalness:0.5}));
        g.add(body);
        const spr = makeSprite('--', '#e9ede7', 1.1);
        spr.position.set(0,0.42,0);
        g.add(spr);
        node.labelSprite = spr;
      } else if (p.kind === 'uart') {
        const shell = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.18,0.24),
          new THREE.MeshStandardMaterial({color:0x111111, roughness:0.5, metalness:0.4}));
        g.add(shell);
        const glow = new THREE.PointLight(0x4ade80, 0, 1.2);
        glow.position.set(0,0.15,0);
        g.add(glow);
        node.glow = glow;
      } else {
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.15,0.25),
          new THREE.MeshStandardMaterial({color:0x333333}));
        g.add(body);
      }

      const lbl2 = makeSprite(p.label || p.id, '#6f7a73', 1.15);
      lbl2.position.set(0,0.52,0);
      g.add(lbl2);

      g.userData.baseY = g.position.y;
      boardGroup.add(g);
      peripheralNodes[p.id] = node;

      // trace tube from MCU edge to peripheral
      const start = new THREE.Vector3(0,-0.55,0);
      const end = new THREE.Vector3(pos[0], -0.85, pos[2]);
      const mid = start.clone().lerp(end,0.5).add(new THREE.Vector3(0,-0.05,0));
      const curve = new THREE.CatmullRomCurve3([start, mid, end]);
      const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.025, 6, false);
      const tubeMat = new THREE.MeshStandardMaterial({color:0x6f4728, emissive:0x000000, roughness:0.4, metalness:0.6});
      const tube = new THREE.Mesh(tubeGeo, tubeMat);
      boardGroup.add(tube);
      traceTubesById[p.id] = tube;
      node.traceMat = tubeMat;
    });
  }

  function setActivity(mat, active, color) {
    if (!mat) return;
    mat.emissive.setHex(active ? color : 0x000000);
    mat.emissiveIntensity = active ? 1.4 : 0;
  }

  /* ============================================================
     CAMERA / INTERACTION
     ============================================================ */
  function updateCamera() {
    const x = camDist * Math.sin(camYaw) * Math.cos(camPitch);
    const y = camDist * Math.sin(camPitch) + 0.4;
    const z = camDist * Math.cos(camYaw) * Math.cos(camPitch);
    camera.position.set(x,y,z);
    camera.lookAt(0,-0.3,0);
  }
  function onPointerDown(e){ dragging=true; lastX=e.clientX; lastY=e.clientY; setAutoRotate(false, true); }
  function onPointerMove(e){
    if(!dragging) return;
    const dx = e.clientX-lastX, dy = e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    camYaw -= dx*0.006;
    camPitch = Math.max(0.12, Math.min(1.15, camPitch + dy*0.005));
    updateCamera();
  }
  function onPointerUp(){ dragging=false; scheduleIdleResume(); }
  function onWheel(e){
    e.preventDefault();
    camDist = Math.max(4.5, Math.min(18, camDist + e.deltaY*0.01));
    updateCamera();
  }
  let autoRotate = true;
  function setAutoRotate(v, userInitiated){
    autoRotate = v;
    if (userInitiated) $('autorotate').checked = v;
  }
  function scheduleIdleResume(){
    clearTimeout(idleTimer);
    if ($('autorotate').checked){
      idleTimer = setTimeout(()=>{ autoRotate = true; }, 1200);
    }
  }
  function onResize(){
    const r = host.getBoundingClientRect();
    W=r.width; H=r.height;
    camera.aspect = W/H; camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(W,H);
  }

  /* ============================================================
     RENDER LOOP + STATE BINDING
     ============================================================ */
  function applyExplode(v){
    explodeAmt = v;
    for (const id in peripheralNodes){
      const n = peripheralNodes[id];
      n.group.position.y = n.group.userData.baseY + v*0.9;
    }
    mcuGroup.position.y = -0.62 + v*0.35;
  }

  function bindAtPlayhead(){
    if (!trace) return;
    const ch = sampleIndex;
    // GPIO -> led/motor/generic
    const gpioLatest = allAt(ch.gpio, playhead_ns, 'pin');
    for (const pid in peripheralNodes){
      const node = peripheralNodes[pid];
      const board = trace.board.peripherals.find(p=>p.id===pid);
      if (!board) continue;
      let active = false, level = 0;
      for (const pin of (board.pins||[])){
        const s = gpioLatest[pin];
        if (s && s.value) { active = true; level = Math.max(level, s.value); }
      }
      if (node.kind === 'led') setActivity(node.mat, active, 0xffb000);
      if (node.kind === 'motor') {
        node.speedRef.v = active ? (level>=1?1:0.4) : 0;
        setActivity(node.traceMat, active, 0xb8733b);
      }
      if (node.kind !== 'motor') setActivity(node.traceMat, active, 0xb8733b);
    }
    // sensors
    const sensorLatest = allAt(ch.sensors, playhead_ns, 'id');
    const kvHost = $('state-kv'); kvHost.innerHTML = '';
    for (const pid in peripheralNodes){
      const node = peripheralNodes[pid];
      if (node.kind !== 'sensor') continue;
      const s = sensorLatest[pid];
      if (s && node.labelSprite){
        const txt = s.value + (s.unit||'');
        node.labelSprite.material.map = labelTexture(txt, s.fault && s.fault!=='none' ? '#ff4f3e' : '#e9ede7');
        node.labelSprite.material.needsUpdate = true;
      }
    }
    for (const key in sensorLatest){
      const s = sensorLatest[key];
      const row = document.createElement('div'); row.className='kv';
      row.innerHTML = `<span>${key}</span><span class="v ${s.fault&&s.fault!=='none'?'fault':'ok'}">${s.value}${s.unit||''} ${s.fault&&s.fault!=='none'?('· '+s.fault.toUpperCase()):''}</span>`;
      kvHost.appendChild(row);
    }
    const faultLatest = latestAt(ch.faults, playhead_ns);
    if (faultLatest){
      const row = document.createElement('div'); row.className='kv';
      row.innerHTML = `<span>FAULT</span><span class="v fault">${faultLatest.kind}</span>`;
      kvHost.appendChild(row);
    }
    // uart log (append rows up to playhead, capped)
    const uartAll = (ch.uart||[]).filter(u=>u.t_ns<=playhead_ns);
    const logHost = $('uart-log');
    const shown = uartAll.slice(-14);
    logHost.innerHTML = shown.map(u=>{
      let text = ''; try { text = atob(u.bytes); } catch(e){ text = '(binary)'; }
      return `<div class="row"><span class="t">${(u.t_ns/1e6).toFixed(1)}ms</span>${escapeHtml(text.trim())}</div>`;
    }).join('');
    $('uart-dir').textContent = shown.length ? shown[shown.length-1].direction.toUpperCase() : '—';
    logHost.scrollTop = logHost.scrollHeight;

    // execution
    const execLatest = latestAt(ch.execution, playhead_ns);
    if (execLatest){
      $('exec-fn').textContent = execLatest.function || '—';
      $('exec-src').textContent = execLatest.source ? (execLatest.source.file+':'+execLatest.source.line) : '—';
    }

    // assertion evidence panel (most recent at/near playhead)
    const nearAssert = (trace.assertions||[]).filter(a=>Math.abs(a.t_ns-playhead_ns) < (trace.duration_ns*0.01)).slice(-1)[0];
    const evHost = $('evidence');
    if (nearAssert){
      evHost.className = 'panel show ' + (nearAssert.verdict==='pass'?'pass':'');
      evHost.innerHTML = `
        <div class="panel-title">ASSERTION · ${nearAssert.type.toUpperCase()}</div>
        <div class="kv"><span>VERDICT</span><span class="v ${nearAssert.verdict==='pass'?'ok':'fault'}">${nearAssert.verdict.toUpperCase()}</span></div>
        <div class="kv"><span>EXPECTED</span><span class="v">${jsShort(nearAssert.expected)}</span></div>
        <div class="kv"><span>OBSERVED</span><span class="v">${jsShort(nearAssert.observed)}</span></div>
        <div class="kv"><span>EVIDENCE</span><span class="v" style="font-size:9px;">${nearAssert.evidence_path||'—'}</span></div>`;
    } else {
      evHost.className = 'panel'; evHost.innerHTML='';
    }

    // header time readout
    $('t-now').textContent = (playhead_ns/1e6).toFixed(2);
    const pct = trace.duration_ns ? (playhead_ns/trace.duration_ns)*100 : 0;
    $('playhead').style.left = pct+'%';
    $('scrub-track').style.width = pct+'%';
  }

  function jsShort(v){
    if (v==null) return '—';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }
  function escapeHtml(s){
    return s.replace(/[&<>"]/g, c=>({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function tick(now){
    requestAnimationFrame(tick);
    if (lastFrameTime==null) lastFrameTime = now;
    const dt = Math.min(now-lastFrameTime, 60); lastFrameTime = now;

    if (autoRotate && !dragging) { camYaw += 0.00018*dt; updateCamera(); }

    if (playing && trace) {
      playhead_ns += dt*1e6*speed;
      if (playhead_ns > trace.duration_ns){ playhead_ns = trace.duration_ns; playing=false; setPlayIcon(); }
      bindAtPlayhead();
    }

    // motor spin
    for (const id in peripheralNodes){
      const n = peripheralNodes[id];
      if (n.kind==='motor' && n.blades){
        n.blades.rotation.y += dt*0.01*(n.speedRef.v*14+ (n.speedRef.v>0?0.02:0));
      }
    }
    renderer.render(scene, camera);
  }

  function setPlayIcon(){
    $('play-pause').textContent = playing ? '❚❚' : '▶';
  }

  /* ============================================================
     TIMELINE UI
     ============================================================ */
  function renderTicks(){
    const wrap = $('scrub-ticks'); wrap.innerHTML='';
    if (!trace) return;
    (trace.assertions||[]).forEach(a=>{
      const pct = trace.duration_ns ? (a.t_ns/trace.duration_ns)*100 : 0;
      const d = document.createElement('div');
      d.className = 'tick' + (a.verdict==='fail' ? ' fail' : '');
      d.style.left = pct+'%';
      d.title = a.type + ' · ' + a.verdict;
      d.addEventListener('click', (e)=>{ e.stopPropagation(); playhead_ns = a.t_ns; bindAtPlayhead(); });
      wrap.appendChild(d);
    });
  }

  function scrubTo(clientX){
    if (!trace) return;
    const r = $('scrub-wrap').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX-r.left)/r.width));
    playhead_ns = pct*trace.duration_ns;
    bindAtPlayhead();
  }

  /* ============================================================
     LOAD / CLEAR / DEMO
     ============================================================ */
  function loadTrace(tr, demo){
    // minimal schema check
    if (!tr || tr.schema !== 'trace.v1' || !tr.board || !tr.channels){
      alert('Not a valid trace.v1 artifact.');
      return;
    }
    trace = tr;
    isDemo = !!demo;
    playhead_ns = 0; playing = false; setPlayIcon();
    buildIndex(trace);
    buildPeripheralsFromBoard(trace.board);
    renderTicks();
    applyExplode(0); $('explode').value = 0;

    $('empty-msg').classList.remove('show');
    $('demo-flag').style.display = isDemo ? 'block' : 'none';
    $('m-chip').textContent = trace.board.chip || '—';
    $('m-test').textContent = trace.test_id || '—';
    $('m-run').textContent = trace.run_id || '—';
    $('m-seed').textContent = trace.seed != null ? trace.seed : '—';
    $('t-total').textContent = (trace.duration_ns/1e6).toFixed(2);

    const dot = $('verdict-dot'); const vt = $('verdict-text');
    dot.className = 'verdict-dot ' + (trace.verdict==='FAIL' ? 'fail' : (trace.verdict==='PASS' ? '' : 'empty'));
    vt.textContent = trace.verdict || 'UNAVAILABLE';

    bindAtPlayhead();
  }

  function clearTrace(){
    trace = null; isDemo = false; playing=false; setPlayIcon();
    playhead_ns = 0;
    clearPeripherals();
    renderTicks();
    $('empty-msg').classList.add('show');
    $('demo-flag').style.display = 'none';
    ['m-chip','m-run','m-seed'].forEach(id=>$(id).textContent='—');
    $('m-test').textContent = '—';
    $('t-now').textContent='0.00'; $('t-total').textContent='0.00';
    $('playhead').style.left='0%'; $('scrub-track').style.width='0%';
    $('state-kv').innerHTML=''; $('uart-log').innerHTML=''; $('exec-fn').textContent='—'; $('exec-src').textContent='—';
    $('evidence').className=''; $('evidence').innerHTML='';
    const dot = $('verdict-dot'); dot.className='verdict-dot empty';
    $('verdict-text').textContent = 'NO DATA';
  }

  /* ============================================================
     WIRE UP CONTROLS
     ============================================================ */
  function wireUI(){
    $('demo-btn').addEventListener('click', ()=> loadTrace(makeDemoTrace(), true));
    $('clear-btn').addEventListener('click', clearTrace);
    $('load-btn').addEventListener('click', ()=> $('fileInput').click());
    $('fileInput').addEventListener('change', (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try { loadTrace(JSON.parse(reader.result), false); }
        catch(err){ alert('Could not parse file as JSON: '+err.message); }
      };
      reader.readAsText(f);
    });

    $('play-pause').addEventListener('click', ()=>{
      if (!trace) return;
      if (playhead_ns >= trace.duration_ns) playhead_ns = 0;
      playing = !playing; setPlayIcon();
    });
    $('step-back').addEventListener('click', ()=>{ if(!trace) return; playhead_ns = Math.max(0, playhead_ns - trace.duration_ns*0.02); bindAtPlayhead(); });
    $('step-fwd').addEventListener('click', ()=>{ if(!trace) return; playhead_ns = Math.min(trace.duration_ns, playhead_ns + trace.duration_ns*0.02); bindAtPlayhead(); });
    $('speed-select').addEventListener('change', (e)=> speed = parseFloat(e.target.value));

    $('scrub-wrap').addEventListener('pointerdown', (e)=>{ scrubTo(e.clientX);
      const move = (ev)=>scrubTo(ev.clientX);
      const up = ()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
      window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
    });

    $('explode').addEventListener('input', (e)=> applyExplode(parseInt(e.target.value)/100));
    $('autorotate').addEventListener('change', (e)=> autoRotate = e.target.checked);
    $('reset-view').addEventListener('click', ()=>{ camYaw=0.5; camPitch=0.55; camDist=9.2; updateCamera(); });
    $('toggle-rail').addEventListener('click', ()=> $('rail').classList.toggle('collapsed'));

    document.addEventListener('keydown', (e)=>{
      if (e.code==='Space'){ e.preventDefault(); $('play-pause').click(); }
    });
  }

  /* ============================================================
     WEBGL FALLBACK
     ============================================================ */
  function hasWebGL() {
    try {
      const canvas = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
    } catch (e) {
      return false;
    }
  }

  function renderFallbackTimeline() {
    if (!trace) return;
    const fb = $('fallback-host');
    fb.innerHTML = '<div style="padding: 20px; font-family: monospace; color: var(--silk);">';
    fb.innerHTML += '<h2 style="color:var(--copper); margin-top:0;">2D FALLBACK (NO WEBGL)</h2>';
    
    // GPIO
    fb.innerHTML += '<div style="margin-bottom:20px;"><h3>GPIO TIMELINE</h3>';
    const duration = trace.duration_ns || 1;
    const gpioByPin = {};
    (trace.channels.gpio || []).forEach(g => {
      if (!gpioByPin[g.pin]) gpioByPin[g.pin] = [];
      gpioByPin[g.pin].push(g);
    });
    
    for (const pin in gpioByPin) {
      fb.innerHTML += `<div style="display:flex; align-items:center; margin-bottom:4px;">
        <div style="width:80px;">${pin}</div>
        <div style="flex:1; height:20px; background:#111; position:relative;">`;
      const events = gpioByPin[pin].sort((a,b)=>a.t_ns-b.t_ns);
      for (let i=0; i<events.length; i++) {
        if (events[i].value === 1) {
          const startPct = (events[i].t_ns / duration) * 100;
          const endNs = (i+1 < events.length) ? events[i+1].t_ns : duration;
          const widthPct = ((endNs - events[i].t_ns) / duration) * 100;
          fb.innerHTML += `<div style="position:absolute; left:${startPct}%; width:${widthPct}%; height:100%; background:var(--sig-green);"></div>`;
        }
      }
      fb.innerHTML += `</div></div>`;
    }
    fb.innerHTML += '</div>';
    
    // SENSORS
    fb.innerHTML += '<div style="margin-bottom:20px;"><h3>SENSORS</h3>';
    const sensorsById = {};
    (trace.channels.sensors || []).forEach(s => {
      if (!sensorsById[s.id]) sensorsById[s.id] = [];
      sensorsById[s.id].push(s);
    });
    for (const sid in sensorsById) {
      fb.innerHTML += `<div>${sid} (Last: ${sensorsById[sid].slice(-1)[0].value})</div>`;
    }
    fb.innerHTML += '</div>';
    
    // UART
    fb.innerHTML += '<div><h3>UART CONSOLE</h3><div style="background:#111; padding:10px; font-family:monospace; max-height:200px; overflow:auto;">';
    (trace.channels.uart || []).forEach(u => {
      let text = ''; try { text = atob(u.bytes); } catch(e) { text = '(binary)'; }
      fb.innerHTML += `<div><span style="color:var(--silk-dim); margin-right:8px;">${(u.t_ns/1e6).toFixed(1)}ms</span><span style="color:var(--sig-green);">${escapeHtml(text.trim())}</span></div>`;
    });
    fb.innerHTML += '</div></div>';
    fb.innerHTML += '</div>';
  }

  /* ============================================================
     BOOT
     ============================================================ */
  let webglAvailable = hasWebGL();
  if (!webglAvailable) {
    console.warn("WebGL not available. Falling back to 2D trace rendering.");
  }

  if (webglAvailable) {
    initScene();
  } else {
    // Hide 3D UI, show fallback
    $('stage-controls').style.display = 'none';
    $('rail').style.display = 'none';
    $('toggle-rail').style.display = 'none';
    
    const fh = document.createElement('div');
    fh.id = 'fallback-host';
    fh.style.cssText = 'position:absolute; inset:0; overflow:auto; background:var(--pcb-black); z-index:5;';
    $('stage-wrap').appendChild(fh);
  }
  
  wireUI();
  
  /* ============================================================
     COMPARISON MODE
     ============================================================ */
  let isCompareMode = false;
  let traceB = null;

  function loadCompare(trA, trB) {
    if (!webglAvailable) {
       alert("Comparison mode requires WebGL.");
       return;
    }
    isCompareMode = true;
    traceB = trB;
    
    // Load first trace normally
    loadTrace(trA, false);
    
    // Build second trace peripherals shifted right
    if (traceB.board) {
      const clonedBoard = JSON.parse(JSON.stringify(traceB.board));
      clonedBoard.peripherals.forEach(p => {
        p.id = p.id + "_B"; // Namespace them
        if (p.position) {
            p.position[0] += 7; // Shift X axis by 7 units
        }
      });
      
      const oldGroup = boardGroup;
      const oldNodes = Object.assign({}, peripheralNodes);
      
      buildPeripheralsFromBoard(clonedBoard);
      
      // Now peripheralNodes contains BOTH A and B.
      Object.assign(peripheralNodes, oldNodes);
      
      // Shift the MCU B as well
      mcuGroup.position.x += 7;
    }
    
    // Find exact divergence timestamp
    let divergenceNs = null;
    
    // Collect all unique timestamps from both traces
    const allTimes = new Set();
    [trace, traceB].forEach(tr => {
      ['gpio', 'sensors'].forEach(chName => {
        (tr.channels[chName] || []).forEach(s => allTimes.add(s.t_ns));
      });
    });
    
    const sortedTimes = Array.from(allTimes).sort((a,b)=>a-b);
    
    for (const t of sortedTimes) {
      const gpioA = allAt(trace.channels.gpio, t, 'pin');
      const gpioB = allAt(traceB.channels.gpio, t, 'pin');
      let diff = false;
      for (const pin in gpioA) {
        if (gpioB[pin] && gpioA[pin].value !== gpioB[pin].value) {
            diff = true; break;
        }
      }
      
      if (!diff) {
          const sensA = allAt(trace.channels.sensors, t, 'id');
          const sensB = allAt(traceB.channels.sensors, t, 'id');
          for (const id in sensA) {
             if (sensB[id] && sensA[id].value !== sensB[id].value) {
                 diff = true; break;
             }
          }
      }
      
      if (diff) {
        divergenceNs = t;
        break;
      }
    }
    
    if (divergenceNs !== null) {
       console.log("DIVERGENCE FOUND AT", divergenceNs, "ns");
       // Add a divergence tick
       const wrap = $('scrub-ticks');
       const pct = (divergenceNs/dur)*100;
       const d = document.createElement('div');
       d.className = 'tick fail';
       d.style.left = pct+'%';
       d.style.background = '#00f'; // Third color (blue) for divergence
       d.title = 'Divergence Point';
       wrap.appendChild(d);
       
       playhead_ns = divergenceNs;
       bindAtPlayhead();
    }
  }

  // Real data wiring boot logic
  const inlineTraceEl = document.getElementById('trace-data');
  const inlineCompareEl = document.getElementById('trace-data-compare');
  
  if (inlineCompareEl) {
      try {
          const arr = JSON.parse(inlineCompareEl.textContent);
          loadCompare(arr[0], arr[1]);
      } catch(err) {
          console.error("Failed to parse compare trace:", err);
          loadTrace(makeDemoTrace(), true);
      }
  } else if (inlineTraceEl) {
      try {
          const inlineTrace = JSON.parse(inlineTraceEl.textContent);
          loadTrace(inlineTrace, false);
      } catch(err) {
          console.error("Failed to parse inline trace:", err);
          loadTrace(makeDemoTrace(), true);
      }
  } else {
      loadTrace(makeDemoTrace(), true); // boot straight into demo so the instrument is alive immediately
  }

  // Monkey-patch loadTrace to render fallback
  const _loadTrace = loadTrace;
  loadTrace = function(tr, demo) {
    _loadTrace(tr, demo);
    if (!webglAvailable) {
      renderFallbackTimeline();
    }
  };
  
  const _bindAtPlayhead = bindAtPlayhead;
  bindAtPlayhead = function() {
      _bindAtPlayhead();
      
      if (isCompareMode && traceB) {
          const chB = {};
          for (const key of Object.keys(traceB.channels)) {
             chB[key] = (traceB.channels[key] || []).slice().sort((a,b)=>a.t_ns-b.t_ns);
          }
          const gpioLatestB = allAt(chB.gpio, playhead_ns, 'pin');
          for (const pid in peripheralNodes){
             if (!pid.endsWith("_B")) continue;
             const origPid = pid.slice(0, -2);
             const board = traceB.board.peripherals.find(p=>p.id===origPid);
             if (!board) continue;
             
             let active = false, level = 0;
             for (const pin of (board.pins||[])){
               const s = gpioLatestB[pin];
               if (s && s.value) { active = true; level = Math.max(level, s.value); }
             }
             const node = peripheralNodes[pid];
             if (node.kind === 'led') setActivity(node.mat, active, 0xffb000);
             if (node.kind === 'motor') {
               node.speedRef.v = active ? (level>=1?1:0.4) : 0;
               setActivity(node.traceMat, active, 0xb8733b);
             }
             if (node.kind !== 'motor') setActivity(node.traceMat, active, 0xb8733b);
          }
      }
  };

})();
</script>
</body>
</html>
